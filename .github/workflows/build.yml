name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'
      - name: Testes do OCR + compilar APK
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publicar registo do build (branch "log")
        if: always()
        run: |
          mkdir -p logout
          cp build.log logout/ 2>/dev/null || echo "sem log" > logout/build.log
          find app/build/test-results -name '*.xml' -exec cp {} logout/ \; 2>/dev/null || true
          cd logout
          git init -q -b log
          git config user.email "ci@github"
          git config user.name "ci"
          git add -A
          git commit -q -m "log ${GITHUB_SHA} run ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" log
      - name: Publicar APK (branch "apk")
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/daikin-ocr.apk
          cd out
          git init -q -b apk
          git config user.email "ci@github"
          git config user.name "ci"
          git add daikin-ocr.apk
          git commit -q -m "APK ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
