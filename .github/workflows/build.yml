name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Testes do OCR (fotos reais dia/noite/flash)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Compilar APK
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK no branch "apk"
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk out/daikin-ocr.apk
          cd out
          git init -q -b apk
          git config user.email "ci@github"
          git config user.name "ci"
          git add daikin-ocr.apk
          git commit -q -m "APK ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios
          path: app/build/reports/
